name: Build Loose Native Directories

on:
  push:
  workflow_dispatch:

jobs:
  build-native:
    name: Build Folder for ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            extra_jvm_args: ""
          - os: ubuntu-latest
            os_name: Linux
            extra_jvm_args: ""
          - os: macos-latest
            os_name: macOS
            extra_jvm_args: "-XstartOnFirstThread"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Fat JAR and Resource Assets via Maven
        run: mvn clean package --batch-mode

      - name: Get JAR Name
        id: get_jar
        shell: bash
        run: |
          JAR_NAME=$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)
          echo "jar_name=${JAR_NAME}.jar" >> $GITHUB_OUTPUT

      - name: Stage Production Payload
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ steps.get_jar.outputs.jar_name }} staging/

      - name: Generate Core Application Image
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --input staging \
            --main-jar ${{ steps.get_jar.outputs.jar_name }} \
            --main-class com.game.Main \
            --name JavaRTSGame \
            --java-options "-XX:+UseZGC -XX:-ZProactive -XX:-ZUncommit -Xms2G -Xmx6G -XX:+UseCompactObjectHeaders --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED ${{ matrix.extra_jvm_args }}" \
            --dest dist

      - name: Merge Resources Directly Into Output Folder
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp -r target/resources dist/JavaRTSGame.app/Contents/MacOS/
          else
            cp -r target/resources dist/JavaRTSGame/
          fi

      - name: Stage OS Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os_name }}
          path: dist/JavaRTSGame*/
          retention-days: 1

  merge-platforms:
    name: Combine OS Builds
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Download all OS builds
        uses: actions/download-artifact@v5
        with:
          path: JavaRTSGame

      - name: Upload Single Master Folder
        uses: actions/upload-artifact@v5
        with:
          name: JavaRTSGame
          path: JavaRTSGame/