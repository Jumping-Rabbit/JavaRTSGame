name: Build Native Executables

on:
  push:
  workflow_dispatch:

jobs:
  build-native:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            package_type: exe
            installer_name: JavaRTSGame-Windows
            extra_jvm_args: ""
          - os: ubuntu-latest
            package_type: deb
            installer_name: JavaRTSGame-Linux
            extra_jvm_args: ""
          - os: macos-latest
            package_type: dmg
            installer_name: JavaRTSGame-macOS
            extra_jvm_args: "-XstartOnFirstThread"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build Fat JAR with Maven
        run: mvn clean package --batch-mode

      - name: Get JAR Name
        id: get_jar
        shell: bash
        run: |
          JAR_NAME=$(mvn help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)
          echo "jar_name=${JAR_NAME}.jar" >> $GITHUB_OUTPUT

      - name: Stage JAR for jpackage
        shell: bash
        run: |
          # Create an isolated directory so jpackage doesn't bundle the whole target folder
          mkdir -p staging
          # Copy ONLY the Fat JAR into the staging directory
          cp target/${{ steps.get_jar.outputs.jar_name }} staging/

      - name: Create Native Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          jpackage `
            --type ${{ matrix.package_type }} `
            --input staging `
            --main-jar ${{ steps.get_jar.outputs.jar_name }} `
            --main-class com.game.Main `
            --name JavaRTSGame `
            --java-options "-XX:+UseZGC -Xms2G -Xmx6G -XX:-ZProactive -XX:-ZUncommit -XX:+UseCompactObjectHeaders --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED ${{ matrix.extra_jvm_args }}" `
            --dest dist

      - name: Create Native Package (macOS & Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          jpackage \
            --type ${{ matrix.package_type }} \
            --input staging \
            --main-jar ${{ steps.get_jar.outputs.jar_name }} \
            --main-class com.game.Main \
            --name JavaRTSGame \
            --java-options "-XX:+UseZGC -Xms2G -Xmx6G -XX:-ZProactive -XX:-ZUncommit -XX:+UseCompactObjectHeaders --sun-misc-unsafe-memory-access=allow --enable-native-access=ALL-UNNAMED ${{ matrix.extra_jvm_args }}" \
            --dest dist

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer_name }}
          path: dist/